name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ApControl.sln

      - name: Build
        run: dotnet build ApControl.sln -c Release --no-restore

      - name: Test (simulated fleet)
        run: dotnet test ApControl.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

  publish:
    name: Publish Windows build
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish server (framework-dependent, win-x64)
        run: dotnet publish src/ApControl.Server -c Release -r win-x64 --self-contained false -o publish/ApControl
      - uses: actions/upload-artifact@v4
        with:
          name: ApControl-win-x64
          path: publish/ApControl/
